[package]
name = "mcseedfinder-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Accuracy-critical Minecraft seed search core."

[lib]
# Crate name is `_native` so the pyo3 pymodule macro produces a matching
# `PyInit__native` symbol for the Python extension (which Python loads from a
# file named `_native.abi3.so`). Rust consumers (e.g. the Tauri desktop) import
# it as `_native::...`; it's the same compiled rlib, just an unusual-looking
# `use` path. Don't rename this without updating the pyo3 pymodule attribute.
name = "_native"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["biomes"]
# Exact biome generation via Cubitect's cubiomes C library, compiled from the
# vendored submodule with the `cc` crate and a small hand-written FFI shim (no
# bindgen — deterministic across toolchains/CI). On by default; disable with
# --no-default-features to build the pure-Rust structure/RNG core without a C
# toolchain (e.g. for the GPU/wasm-friendly prefilter path).
biomes = []
# NOTE: `pyo3` is intentionally NOT declared as an explicit feature. It stays an
# implicit feature of the optional `pyo3` dependency so that maturin's
# `features = ["pyo3/extension-module"]` activates `#[cfg(feature = "pyo3")]`.
# Declaring `pyo3 = ["dep:pyo3"]` here would decouple the two and break the build.

[dependencies]
pyo3 = { version = "0.21", optional = true, features = ["abi3-py310"] }
# Tree-spec wire format between Python's compiled conditions and the native
# structure-only fast-path. Kept small and used only at PyO3 boundaries.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Biome tile rendering: PNG encoder + base64 wrapper for the desktop renderer.
# `png` is much lighter than the `image` crate; we only need to write PNGs.
png = "0.17"
base64 = "0.22"

[build-dependencies]
# Compiles the vendored cubiomes C sources + shim when the `biomes` feature is on.
cc = "1.0"
