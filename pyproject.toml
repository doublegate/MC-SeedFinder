[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "mcseedfinder"
version = "0.1.0"
description = "Find Minecraft Java Edition world seeds matching desired map characteristics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mcseedfinder contributors" }]
keywords = ["minecraft", "seed", "world-generation", "cubiomes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
]
dependencies = []  # zero runtime deps — pure stdlib

[project.optional-dependencies]
# Plug in the real cubiomes-backed biome generator. Not required for
# structure searches; only needed if you want bit-exact biome filtering.
accurate = ["cubiomes-py>=0.1"]
dev = ["pytest>=7", "pytest-cov", "mypy"]

[project.scripts]
mcseedfinder = "mcseedfinder.cli:main"

[project.urls]
Homepage = "https://example.invalid/mcseedfinder"

[tool.setuptools.packages.find]
where = ["src"]

[tool.maturin]
manifest-path = "crates/mcseedfinder-core/Cargo.toml"
python-source = "src"
module-name = "mcseedfinder._native"
features = ["pyo3/extension-module"]
